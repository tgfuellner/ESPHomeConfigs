# Test Oled EC11 Rotary Encoder
#
 
esphome:
  name: oled-ec11
  on_boot:
      priority: -100
      then:
        - sensor.rotary_encoder.set_value:
            id: mein_encoder
            value: 30.0 # Standard-Sollwert beim Einschalten
            
esp8266:
  board: d1_mini

globals:
  - id: wlan_bereit
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: thermostat_logik
    then:
      # Bedingung 1: Ist-Temperatur >= Soll-Temperatur -> Relais AUS
      - if:
          condition:
            lambda: 'return id(temp).state >= id(mein_encoder).state;'
          then:
            - switch.turn_off: relais
            
      # Bedingung 2: Ist-Temperatur <= (Soll-Temperatur - 1 Grad) -> Relais AN
      - if:
          condition:
            lambda: 'return id(temp).state <= (id(mein_encoder).state - 1.0);'
          then:
            - switch.turn_on: relais

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  fast_connect: true
  power_save_mode: none # Verhindert, dass das WLAN-Modul schlafen geht
  #min_auth_mode: WPA2
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Oled_EC11"
    password: "Bk1Ovr90Ycl9"

  on_connect:
    then:
      - globals.set:
          id: wlan_bereit
          value: 'true'


i2c:
  sda: D2 # 4
  scl: D1 # 5
  frequency: 800kHz

one_wire:
  platform: gpio
  pin: D4 # GPIO2

font:
  - file: "gfonts://Open Sans"
    id: my_font
    size: 16

sensor:
  - platform: rotary_encoder
    id: mein_encoder
    pin_a: 
      number: D5 # 14
      mode: INPUT_PULLUP
    pin_b: 
      number: D6 # 12
      mode: INPUT_PULLUP
    name: "Stell Temperatur"
    unit_of_measurement: "°C"
   # Probiere hier 2 oder 4, falls er bei einem Klick 2-4 Schritte macht
    resolution: 1 
    # Ein Filter hilft, extrem kurze Störimpulse zu ignorieren
    filters:
      - debounce: 20ms
    min_value: 10
    max_value: 50
    on_value:
      then:
        - script.execute: thermostat_logik # Prüft das Relais beim Drehen
        - component.update: mein_display

  - platform: dallas_temp
    address: 0xbf3c01d0757d3f28 # Wird nach dem ersten Boot im Log angezeigt
    name: "Temperatur"
    id: temp
    update_interval: 10s
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    on_value:
      then:
        - script.execute: thermostat_logik # Prüft das Relais bei neuer Temperatur
        - component.update: mein_display

binary_sensor:
  - platform: gpio
    id: encoder_button
    pin: 
      number: D7 # 13
      mode: INPUT_PULLUP
      inverted: true
    name: "Encoder Klick"
    on_state:
      then:
        - component.update: mein_display
    on_press:
      then:
        - switch.toggle: relais

switch:
  - platform: gpio
    pin:
      number: D0
      inverted: true
    id: relais
    name: "Relais"
    # ALWAYS_OFF stellt sicher, dass das Relais nach einem Stromausfall sicherheitshalber AUS bleibt
    restore_mode: ALWAYS_OFF

display:
  - platform: ssd1306_i2c
    id: mein_display
    model: "SH1106 128x64"
    address: 0x3C
    lambda: |-
      if (id(wlan_bereit)) {
        it.printf(0, 0, id(my_font), "T set: %.0f°C", id(mein_encoder).state);
        if (id(temp).has_state()) {
          it.printf(0, 23, id(my_font), "T cur: %.1f°C", id(temp).state);
        }
      
        // Relais Status anzeigen
        if (id(relais).state) {
           it.print(0, 45, id(my_font), "Relais: AN");
        } else {
           it.print(0, 45, id(my_font), "Relais: AUS");
        }

      }
