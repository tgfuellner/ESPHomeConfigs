esphome:
  name: balkonplugs
  friendly_name: Balkon Plugs

esp8266:
  board: esp01_1m

# WLAN-Konfiguration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: balkonplugs
    password:  "kjlhlhyu"

  # Optionale statische IP
  # manual_ip:
  #   static_ip: 192.168.1.150
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0


# Native Home Assistant Integration
api:
  encryption:
    key: !secret api_encryption_key


# Over-The-Air Updates
ota:
  - platform: esphome

logger:

# Physischer Taster am Gehäuse (GPIO0)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Sonoff POW Taster"
    on_press:
      - switch.toggle: relay

# Relay & Status-LED
switch:
  - platform: gpio
    name: "Sonoff POW Schalter"
    pin: GPIO12
    id: relay
    icon: "mdi:power"
    restore_mode: ALWAYS_ON

status_led:
  pin:
    number: GPIO15
    inverted: true

# Strom-, Spannungs- und Leistungsmessung (HLW8012)
sensor:
  - platform: hlw8012
    sel_pin:
      number: GPIO05
      inverted: true
    cf_pin: GPIO14
    cf1_pin: GPIO13
    
    # Grundkalibrierung für Sonoff POW R1
    voltage_divider: 5577.014
    current_resistor: 0.00198
    
    voltage:
      name: "Spannung"
      unit_of_measurement: "V"
      accuracy_decimals: 1
    current:
      name: "Stromstärke"
      unit_of_measurement: "A"
      accuracy_decimals: 2
      filters:
        - multiply: 0.9989
    power:
      name: "Leistung"
      unit_of_measurement: "W"
      id: pow_power
      accuracy_decimals: 1
    energy:
      name: "Energy"
      unit_of_measurement: kWh
      accuracy_decimals: 3
      filters:
        - multiply: 0.001   # Wh → kWh
    update_interval: 10s

  # Verbrauchszähler in kWh (berechnet aus der Leistung)
  - platform: total_daily_energy
    name: "Verbrauch Heute"
    power_id: pow_power
    filters:
      - multiply: 0.001
    unit_of_measurement: "kWh"
    accuracy_decimals: 3

# Erforderlich für total_daily_energy (setzt den Zähler um Mitternacht zurück)
time:
  - platform: homeassistant
    id: homeassistant_time
