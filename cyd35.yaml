            width: 150
            text_align: CENTER
            text_font: font_18
            text_color: 0xAAAAAA
        - label:
            id: lbl_netz
            text: "-- W"
            x: 5
            y: 215
            width: 150
            text_align: CENTER
            text_font: font_26
            text_color: 0xFFFFFF

        # Spalte 2
        - label:
            text: "Akku raus"
            x: 165
            y: 20
            width: 150
            text_align: CENTER
            text_font: font_18
            text_color: 0xAAAAAA
        - label:
            id: lbl_akku
            text: "-- W"
            x: 165
            y: 55
            width: 150
            text_align: CENTER
            text_font: font_26
            text_color: 0xFFFFFF

        - label:
            text: "Ladew Akku"
            x: 165
            y: 180
            width: 150
            text_align: CENTER
            text_font: font_18
            text_color: 0xAAAAAA
        - label:
            id: lbl_ladew_akku
            text: "-- W"
            x: 165
            y: 215
            width: 150
            text_align: CENTER
            text_font: font_26
            text_color: 0xFFFFFF

        # Spalte 3
        - label:
            text: "Haus"
            x: 325
            y: 20
            width: 150
            text_align: CENTER
            text_font: font_18
            text_color: 0xAAAAAA
        - label:
            id: lbl_haus
            text: "-- W"
            x: 325
            y: 55
            width: 150
            text_align: CENTER
            text_font: font_26
            text_color: 0xFFFFFF

        - label:
            text: "Ladew"
            x: 325
