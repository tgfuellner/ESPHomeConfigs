# Zeigt Homeassistant Sensoren auf einem CYD 3.5 an (ESP32-3248S035)
# 
esphome:
  name: cyd35
  friendly_name: cyd35

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: WLAN
  password: !secret wifi_password
  ap:
    ssid: "Cyd35 Fallback"

captive_portal:

spi:
  - id: tft
    clk_pin: 14
    mosi_pin: 13
    miso_pin:
      number: 12
      ignore_strapping_warning: true

output:
  - id: backlight_pwm
    platform: ledc
    pin: GPIO27
  - id: output_red
    platform: ledc
    pin: 4
    inverted: true
  - id: output_green
    platform: ledc
    pin: 16
    inverted: true
  - id: output_blue
    platform: ledc
    pin: 17
    inverted: true

light:
  - id: backlight
    platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    restore_mode: ALWAYS_ON
  - id: led
    name: "Display LED"
    platform: rgb
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

# WICHTIG: Auf manchen 3.5"-CYDs sitzt statt eines ILI9341-kompatiblen
# Controllers ein ST7796. Wenn das Bild nach dem Flashen verzerrt/falsch
# eingefärbt ist, "model: ILI9341" unten durch "model: ST7796" ersetzen.
display:
  - id: main_display
    platform: ili9xxx
    model: ST7796
    dimensions:
      height: 320
      width: 480
    spi_id: tft
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    reset_pin: GPIO3
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false
    transform:
      mirror_x: true
      swap_xy: true
      mirror_y: true

touchscreen:
  - id: main_touchscreen
    platform: xpt2046
    spi_id: tft
    cs_pin: 33
    interrupt_pin: 36
    threshold: 400
    calibration:
      x_min: 274
      x_max: 3789
      y_min: 343
      y_max: 3880
    transform:
      mirror_x: false
      swap_xy: true
      mirror_y: true

# Eigene Schriftart mit deutschen Sonderzeichen. Die eingebauten
# LVGL-Fonts (montserrat_XX) enthalten nur ASCII + Gradzeichen,
# daher fehlt dort ä/ö/ü/ß.
font:
  - file: "gfonts://Montserrat"
    id: font_28
    size: 28
    glyphs: "!\"%()+=,-.:°ÄÖÜäöüß0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "
  - file: "gfonts://Montserrat"
    id: font_48
    size: 48
    glyphs: "°0123456789,.- C"
  - file: "gfonts://Montserrat"
    id: font_18
    size: 18
    glyphs: "!\"%()+=,-.:°ÄÖÜäöüß0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "
  - file: "gfonts://Montserrat"
    id: font_38
    size: 38
    glyphs: "!%()+=,-.:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "

# Holt den Wert des bestehenden Home-Assistant-Sensors auf das Board.
# Sobald Home Assistant einen neuen Wert meldet, wird das LVGL-Label
# unten automatisch aktualisiert.
sensor:
  # Liest die Akku-Spannung über einen Spannungsteiler am ADC-Pin.
  # WICHTIG: pin und multiply-Faktor an deine tatsächliche Verschaltung
  # anpassen! multiply = (R1+R2)/R2 deines Spannungsteilers.
  # Da "name:" gesetzt ist, taucht dieser Sensor automatisch als Entität
  # in Home Assistant auf (über die bestehende api:-Verbindung) -
  # dafür ist kein zusätzlicher Code nötig.
  - platform: adc
    pin: GPIO35
    name: "Akku Spannung"
    id: akku_spannung
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
    on_value:
      then:
        - lvgl.label.update:
            id: [lbl_akku_spannung, lbl_akku_spannung2]
            text: !lambda 'return str_sprintf("%.2f V", x);'

  - platform: homeassistant
    id: temp_aussen_nord
    entity_id: sensor.tempaussennord_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_temp_value
            text: !lambda 'return str_sprintf("%.1f °C", x);'

  # --- Energie-Übersicht (6 Kacheln, 3 Spalten x 2 Zeilen) ---
  - platform: homeassistant
    id: sn_verbrauch
    entity_id: sensor.sonnenbatterie_99688_state_consumption_current
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_verbrauch
            text: !lambda 'return str_sprintf("%.0f", x);'

  - platform: homeassistant
    id: sn_netz
    entity_id: sensor.sonnenbatterie_99688_state_grid_inout
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_netz
            text: !lambda 'return str_sprintf("%.0f", x);'
        - if:
            condition:
              lambda: 'return x >= 0;'
            then:
              - lvgl.label.update:
                  id: lbl_netz
                  text_color: 0x00E000
            else:
              - lvgl.label.update:
                  id: lbl_netz
                  text_color: 0xFF3333

  - platform: homeassistant
    id: sn_akku
    entity_id: sensor.sonnenbatterie_99688_state_battery_inout
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_akku
            text: !lambda 'return str_sprintf("%.0f", x);'
        - if:
            condition:
              lambda: 'return x < 0;'
            then:
              - lvgl.label.update:
                  id: lbl_akku
                  text_color: 0x00E000
            else:
              - lvgl.label.update:
                  id: lbl_akku
                  text_color: 0xFFFFFF

  - platform: homeassistant
    id: sn_ladew_akku
    entity_id: sensor.ladewagenbatterypower
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_ladew_akku
            text: !lambda 'return str_sprintf("%.0f", x);'

  - platform: homeassistant
    id: sn_haus
    entity_id: sensor.solar_haus_produktion
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_haus
            text: !lambda 'return str_sprintf("%.0f", x);'

  - platform: homeassistant
    id: sn_ladew
    entity_id: sensor.solar_ladewagen_produktion
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_ladew
            text: !lambda 'return str_sprintf("%.0f", x);'

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touchscreen
  pages:
    - id: home_page
      bg_color: 0x000000
      widgets:
        - label:
            text: "Außen Nord"
            align: TOP_MID
            y: 40
            text_font: font_28
            text_color: 0xAAAAAA
        - label:
            id: lbl_temp_value
            text: "--.- °C"
            align: CENTER
            text_font: font_48
            text_color: 0xFFFFFF
        - label:
            id: lbl_akku_spannung
            text: "-- V"
            align: BOTTOM_LEFT
            x: 5
            y: -5
            text_font: font_18
            text_color: 0x81CC66
        # Unsichtbare Tipp-Fläche über die rechte Bildschirmhälfte,
        # wechselt zur Energie-Seite.
        - obj:
            x: 240
            y: 0
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            clickable: true
            on_click:
              - lvgl.page.show: energy_page

    - id: energy_page
      bg_color: 0x111827
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: lv_obj_4
            width: 160
            height: 160
            align: TOP_LEFT
            bg_opa: 0%
            border_width: 1
            border_color: 0xE0E0E0
            pad_all: 0
            widgets:
              - label:
                  text: "Verbrauch"
                  text_font: font_18
                  align: TOP_MID
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_verbrauch
                  align: CENTER
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_38

        - obj:
            id: lv_obj_5
            x: 0
            y: 0
            width: 160
            height: 160
            align: TOP_MID
            bg_opa: 0%
            border_width: 1
            pad_all: 0
            widgets:
              - label:
                  text: "Erzeugung"
                  text_font: font_18
                  align: TOP_MID
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_haus
                  align: CENTER
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_38

        - obj:
            id: lv_obj_6
            width: 160
            height: 160
            align: TOP_RIGHT
            bg_opa: 10%
            border_width: 1
            border_color: 0x81CC66
            pad_all: 0
            widgets:
              - label:
                  text: "Ladew Akku"
                  text_font: font_18
                  align: TOP_MID
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_ladew_akku
                  align: CENTER
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_38
              - label:
                  text: "Ladung"
                  text_font: font_18
                  align: BOTTOM_MID
                  text_color: 0xFFFFFF

        - obj:
            id: lv_obj_7
            width: 160
            height: 160
            align: BOTTOM_LEFT
            bg_opa: 0%
            border_width: 1
            pad_all: 0
            widgets:
              - label:
                  text: "Netz raus"
                  text_font: font_18
                  align: TOP_MID
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_netz
                  align: CENTER
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_38
              - label:
                  id: lbl_akku_spannung2
                  text: "-- V"
                  align: BOTTOM_LEFT
                  text_font: font_18
                  text_color: 0x81CC66

        - obj:
            id: lv_obj_8
            width: 160
            height: 160
            align: BOTTOM_MID
            bg_opa: 0%
            border_width: 1
            pad_all: 0
            widgets:
              - label:
                  text: "Akku raus"
                  text_font: font_18
                  align: TOP_MID
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_akku
                  align: CENTER
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_38

        - obj:
            id: lv_obj_9
            width: 160
            height: 160
            align: BOTTOM_RIGHT
            bg_opa: 10%
            border_width: 1
            border_color: 0x81CC66
            pad_all: 0
            widgets:
              - label:
                  text: "Ladew PV"
                  text_font: font_18
                  align: TOP_MID
                  text_color: 0xFFFFFF
              - label:
                  id: lbl_ladew
                  align: CENTER
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_38
              - label:
                  text: "Erzeugung"
                  text_font: font_18
                  align: BOTTOM_MID
                  text_color: 0xFFFFFF

        # Unsichtbare Tipp-Fläche über die linke Bildschirmhälfte,
